<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>고객 상품 목록</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        .container {
            max-width: 1100px;
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h2 mb-1">고객 상품 목록</h1>
            <p class="text-muted mb-0">판매 중인 상품을 둘러보고 원하는 상품을 선택하세요.</p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" th:href="@{/basic/items}">관리자 화면</a>
            <a class="btn btn-dark" th:href="@{/shop/items/cart}">장바구니</a>
        </div>
    </div>

    <div class="card shadow-sm" th:if="${#lists.isEmpty(items)}">
        <div class="card-body p-5 text-center">
            <h2 class="h4 mb-3">등록된 상품이 없습니다</h2>
            <p class="text-muted mb-0">관리자 화면에서 상품을 등록하면 이 목록에 표시됩니다.</p>
        </div>
    </div>

    <div class="row g-4" th:if="${not #lists.isEmpty(items)}">
        <div class="col-md-6 col-lg-4" th:each="item : ${items}">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <span class="badge text-bg-secondary" th:text="'상품 #' + ${item.id}">상품 #1</span>
                        <span class="badge text-bg-success" th:if="${item.quantity > 0}">판매중</span>
                        <span class="badge text-bg-danger" th:if="${item.quantity == 0}">품절</span>
                    </div>

                    <h2 class="h4 mb-2" th:text="${item.itemName}">상품명</h2>
                    <div class="text-muted mb-2" th:text="'재고 ' + ${item.quantity} + '개'">재고 0개</div>
                    <div class="fs-4 fw-bold mb-4" th:text="${item.price} + '원'">10000원</div>

                    <div class="mt-auto d-grid">
                        <a class="btn btn-primary"
                           th:href="@{/shop/items/{itemId}(itemId=${item.id})}">상품 보기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
