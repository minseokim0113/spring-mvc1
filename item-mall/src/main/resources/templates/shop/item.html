<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>상품 상세</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <style>
        .container {
            max-width: 1100px;
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="mb-4">
        <a class="btn btn-link px-0" th:href="@{/shop/items}">상품 목록으로 돌아가기</a>
    </div>

    <div class="card shadow-sm" th:if="${item == null}">
        <div class="card-body p-5 text-center">
            <h1 class="h4 mb-3">상품을 찾을 수 없습니다</h1>
            <a class="btn btn-primary" th:href="@{/shop/items}">목록으로 이동</a>
        </div>
    </div>

    <div class="row g-4 align-items-start" th:if="${item != null}">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <span class="badge text-bg-secondary" th:text="'상품 #' + ${item.id}">상품 #1</span>
                        <span class="badge text-bg-success" th:if="${item.quantity > 0}">구매 가능</span>
                        <span class="badge text-bg-danger" th:if="${item.quantity == 0}">품절</span>
                    </div>

                    <h1 class="h2 mb-3" th:text="${item.itemName}">상품명</h1>
                    <div class="fs-3 fw-bold mb-4" th:text="${item.price} + '원'">10000원</div>

                    <dl class="row mb-0">
                        <dt class="col-sm-3">상품 번호</dt>
                        <dd class="col-sm-9" th:text="${item.id}">1</dd>

                        <dt class="col-sm-3">가격</dt>
                        <dd class="col-sm-9" th:text="${item.price} + '원'">10000원</dd>

                        <dt class="col-sm-3">재고</dt>
                        <dd class="col-sm-9" th:text="${item.quantity} + '개'">10개</dd>
                    </dl>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="h4 mb-4">구매 옵션</h2>
                    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
                    <form method="post" th:if="${item.quantity > 0}">
                        <div class="mb-3">
                            <label class="form-label" for="quantity">수량</label>
                            <input class="form-control" id="quantity" name="quantity" type="number" min="1"
                                   th:attr="max=${item.quantity}" value="1">
                        </div>

                        <div class="d-grid gap-3">
                            <button class="btn btn-outline-dark btn-lg"
                                    th:formaction="@{/shop/items/{itemId}/cart(itemId=${item.id})}"
                                    type="submit">장바구니 담기</button>
                            <button class="btn btn-primary btn-lg"
                                    th:formaction="@{/shop/items/{itemId}/checkout(itemId=${item.id})}"
                                    type="submit">바로 구매</button>
                        </div>
                    </form>

                    <div class="alert alert-secondary mb-0" th:if="${item.quantity == 0}">
                        현재 품절된 상품입니다.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
